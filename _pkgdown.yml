url: https://henriquesposito.github.io/poldis
template:
  bootstrap: 5
navbar:
  structure:
    left: [home, reference, articles, news]
    right: [packages, search, github]
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Home
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/globalgov/manyenviron
      aria-label: GitHub
reference:
  - title: "Text Tools"
    desc: "These general text functions help you working with texts."
    contents:
    - starts_with("extract")
    - split_text
    - read_pdf
    - annotate_text
  - title: "Priorities"
    desc: "Select political priorities in political discourses."
    contents:
    - select_priorities
  - title: "Topic"
    desc: "Gather political topics in political discourses."
    contents:
    - starts_with("gather")
  - title: "Urgency"
    desc: "Conduct urgency analysis in political discourses."
    contents:
    - get_urgency
  - title: "Data"
    desc: "Text data for innaugural addresses from US presidents since 1993."
    contents:
    - US_inaugural_addresses_1993_2025
